name: Update photo picks

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 python-dateutil

      - name: Build photo picks
        run: python scripts/update_photo_picks.py

      - name: Commit changed picks
        run: |
          if git diff --quiet -- photo-picks.json; then
            echo "No changes."
            exit 0
          fi

          git config user.name "photo-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add photo-picks.json
          git commit -m "Update daily photography picks"
          git push
